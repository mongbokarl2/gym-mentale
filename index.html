<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym mentale</title>
<style>
:root{--bg:#EEF2F7;--surf:#fff;--ink:#14213D;--mute:#5B6B86;--acc:#2A6FDB;--ok:#1E9E6A;--ko:#D64550;--line:#D5DDE9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--surf:#19243A;--ink:#EAF0FB;--mute:#9AABC7;--acc:#6FA2F5;--ok:#3CC48C;--ko:#F0707A;--line:#2B3A57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1726;--surf:#19243A;--ink:#EAF0FB;--mute:#9AABC7;--acc:#6FA2F5;--ok:#3CC48C;--ko:#F0707A;--line:#2B3A57;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:14px;min-height:90vh}
h1{font-size:2.4rem;line-height:1.05;margin:24px 0 4px;font-weight:800;letter-spacing:-.02em}
p{margin:0;color:var(--mute)}
button,select{font:inherit;color:inherit;cursor:pointer}
.big{background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:left;font-size:1.4rem;font-weight:700}
.big small{display:block;font-weight:400;font-size:.95rem;color:var(--mute);margin-top:4px}
.big:active,.opt:active{transform:scale(.98)}
select{width:100%;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.1rem;font-weight:700}
.len{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.len button{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:16px 6px;font-weight:700;font-size:1.05rem}
.len button span{display:block;font-weight:400;font-size:.85rem;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.back{background:none;border:0;color:var(--acc);font-weight:700;font-size:1rem;padding:6px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{flex:1;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;text-align:center;padding:24px 0}
.opts{display:grid;gap:12px}
.opt{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:20px;font-size:1.5rem;font-weight:700}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--surf))}
.score{font-size:4rem;font-weight:800;text-align:center;margin:30px 0 0}
.res{text-align:center}
.cta{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:18px;font-weight:700;font-size:1.1rem}
.cta.alt{background:var(--surf);color:var(--ink);border:2px solid var(--line)}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Dictionary files (one line per word, "english:translation")
const FILES={fr:'dictionnaire-en-fr.txt',it:'dictionnaire-en-it.txt'};
const NAMES={fr:'French',it:'Italian'};
const LEN={short:3,medium:7,long:17};
const $=document.getElementById('app');
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let best={},lang='fr';
try{best=JSON.parse(localStorage.getItem('best')||'{}');lang=localStorage.getItem('lang')||'fr'}catch(e){}
if(!FILES[lang])lang='fr';
function saveBest(k,v){if(!(best[k]>=v)){best[k]=v;try{localStorage.setItem('best',JSON.stringify(best))}catch(e){}}}

const cache={};
async function loadDict(l){
  if(cache[l])return cache[l];
  const r=await fetch(FILES[l]);
  if(!r.ok)throw new Error(r.status);
  const t=await r.text();
  const d=t.split('\n').map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')&&s.includes(':'))
    .map(s=>{const i=s.indexOf(':');return{en:s.slice(0,i).trim(),src:s.slice(i+1).trim()}});
  if(d.length<4)throw new Error('empty');
  return cache[l]=d;
}

function home(){
  $.innerHTML=`<h1>Gym mentale</h1><p>Pick a game.</p>
  <button class="big" data-g="calc">Mental calculation<small>Find the right result</small></button>
  <button class="big" data-g="words">English training<small>Translate words into English</small></button>`;
  $.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>pick(b.dataset.g));
}
function pick(g){
  const words=g==='words';
  $.innerHTML=`<button class="back" id="b">‹ Back</button><h1 style="margin-top:4px">${words?'English training':'Mental calculation'}</h1>
  ${words?`<p>Source language</p><select id="l">${Object.keys(FILES).map(k=>`<option value="${k}"${k===lang?' selected':''}>${NAMES[k]} → English</option>`).join('')}</select>`:''}
  <p>Round length</p>
  <div class="len">${Object.entries(LEN).map(([k,n])=>`<button data-k="${k}">${k[0].toUpperCase()+k.slice(1)}<span>${n} questions</span></button>`).join('')}</div>
  <p id="rec"></p>`;
  const rec=()=>{const key=words?'words'+lang:'calc';
    document.getElementById('rec').textContent=Object.keys(LEN).map(k=>best[key+k]!=null?`Best ${k}: ${best[key+k]}/${LEN[k]}`:'').filter(Boolean).join(' · ')};
  rec();
  document.getElementById('b').onclick=home;
  if(words)document.getElementById('l').onchange=e=>{lang=e.target.value;try{localStorage.setItem('lang',lang)}catch(x){}rec()};
  $.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>play(g,b.dataset.k));
}
function mkCalc(){
  const t=rnd(3);let a,b,txt,r;
  if(t===0){a=10+rnd(90);b=10+rnd(90);r=a+b;txt=`${a} + ${b}`}
  else if(t===1){a=30+rnd(70);b=10+rnd(a-10);r=a-b;txt=`${a} − ${b}`}
  else{a=2+rnd(11);b=2+rnd(11);r=a*b;txt=`${a} × ${b}`}
  const s=new Set([r]);
  while(s.size<3){const v=r+[-10,-2,-1,1,2,10,a%10||3][rnd(7)];if(v>0)s.add(v)}
  return{q:txt+' = ?',opts:shuf([...s]).map(String),ans:String(r)};
}
function mkWord(D){
  const w=D[rnd(D.length)];const verb=w.en.startsWith('to ');
  const pool=D.filter(x=>x.en!==w.en&&x.en.startsWith('to ')===verb);
  const opts=shuf(pool).slice(0,2).map(x=>x.en);
  return{q:w.src,opts:shuf([w.en,...opts]),ans:w.en};
}
async function play(g,k){
  const N=LEN[k];let D=null;
  if(g==='words'){
    $.innerHTML='<p style="margin-top:40px;text-align:center">Loading…</p>';
    try{D=await loadDict(lang)}catch(e){
      $.innerHTML=`<p style="margin-top:40px">Could not load ${FILES[lang]}. Check the file is in the same folder as index.html.</p><button class="cta alt" id="h">Back</button>`;
      document.getElementById('h').onclick=()=>pick(g);return;
    }
  }
  let i=0,sc=0;
  const next=()=>{
    if(i>=N)return end(g,k,sc,N);
    const q=g==='calc'?mkCalc():mkWord(D);let lock=false;
    $.innerHTML=`<div class="top"><button class="back" id="x">‹ Quit</button><span>${i+1} / ${N}</span></div>
    <div class="bar"><i style="width:${i/N*100}%"></i></div>
    <div class="q">${q.q}</div>
    <div class="opts">${q.opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
    document.getElementById('x').onclick=()=>pick(g);
    $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(lock)return;lock=true;
      const good=b.textContent===q.ans;
      if(good)sc++;
      b.classList.add(good?'ok':'ko');
      if(!good)$.querySelectorAll('.opt').forEach(x=>{if(x.textContent===q.ans)x.classList.add('ok')});
      i++;setTimeout(next,good?500:1100);
    });
  };
  next();
}
function end(g,k,sc,N){
  saveBest((g==='words'?'words'+lang:'calc')+k,sc);
  const m=sc===N?'Perfect!':sc>=N*.7?'Great job':sc>=N*.4?'Not bad':'Try again?';
  $.innerHTML=`<div class="score">${sc}/${N}</div><p class="res">${m}</p><div style="flex:1"></div>
  <button class="cta" id="r">Play again</button><button class="cta alt" id="h">Home</button>`;
  document.getElementById('r').onclick=()=>play(g,k);
  document.getElementById('h').onclick=home;
}
home();
</script>
</body>
</html>
